# Copier vers : /opt/downpricer/nginx/conf.d/stock-sitereadyshd.conf
# Version HTTP seule (étape avant certificat).
# Ne pas modifier les autres fichiers de conf.d.

server {
    listen 80;
    server_name stock.sitereadyshd.fr;

    client_max_body_size 15m;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_fastbag http://fastbag-web:3000;
        proxy_pass $upstream_fastbag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
