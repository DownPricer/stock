# Copier vers : /opt/downpricer/nginx/conf.d/stock-sitereadyshd.conf
# Version HTTP + HTTPS (après certificat Let's Encrypt).
# Certificats attendus sur l'hôte :
#   /opt/downpricer/nginx/ssl/stock.sitereadyshd.fr/fullchain.pem
#   /opt/downpricer/nginx/ssl/stock.sitereadyshd.fr/privkey.pem
# (montés dans le conteneur sous /etc/nginx/ssl/...)
# Ne pas modifier les autres fichiers de conf.d.

server {
    listen 80;
    server_name stock.sitereadyshd.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stock.sitereadyshd.fr;

    ssl_certificate     /etc/nginx/ssl/stock.sitereadyshd.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/stock.sitereadyshd.fr/privkey.pem;

    client_max_body_size 15m;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_fastbag http://fastbag-web:3000;
        proxy_pass $upstream_fastbag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
